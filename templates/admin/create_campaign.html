{% extends "base.html" %}

{% block title %}Tạo chiến dịch - Quản trị viên{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>Tạo chiến dịch mới</h5>
                </div>
                <div class="card-body">
                    <form action="/admin/campaigns/create" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên chiến dịch</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="organizer_id" class="form-label">Người tổ chức</label>
                            <select class="form-select" id="organizer_id" name="organizer_id" required>
                                <option value="" selected disabled>Chọn người tổ chức</option>
                                {% if users %}
                                    {% for user_option in users %}
                                    <option value="{{ user_option.user_id }}">
                                        {{ user_option.name }} ({{ user_option.username }})
                                    </option>
                                    {% endfor %}
                                {% else %}
                                    <option value="" disabled>Không tìm thấy người dùng trong hệ thống</option>
                                {% endif %}
                            </select>
                            <div class="form-text">Chọn người dùng sẽ tổ chức chiến dịch này</div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="start_date" class="form-label">Ngày bắt đầu</label>
                                <input type="date" class="form-control" id="start_date" name="start_date" required>
                            </div>
                            <div class="col-md-6">
                                <label for="end_date" class="form-label">Ngày kết thúc</label>
                                <input type="date" class="form-control" id="end_date" name="end_date" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="campaign_type" class="form-label">Loại chiến dịch</label>
                            <select class="form-select" id="campaign_type" name="campaign_type" required>
                                <option value="fundraising">Gây quỹ</option>
                                <option value="donation">Quyên góp</option>
                                <!-- <option value="exchange">Exchange</option> -->
                            </select>
                        </div>
                        
                        <div class="mb-3" id="goal-amount-section">
                            <label for="goal_amount" class="form-label">Mục tiêu số tiền (VNĐ)</label>
                            <input type="number" class="form-control" id="goal_amount" name="goal_amount" min="0" step="0.01">
                            <div class="form-text">Chỉ áp dụng cho chiến dịch gây quỹ.</div>
                        </div>
                        <div class="mb-3" id="goal-item-section" style="display:none;">
                            <label for="goal_item" class="form-label">Mục tiêu số lượng vật phẩm</label>
                            <input type="number" class="form-control" id="goal_item" name="goal_item" min="1">
                            <div class="form-text">Chỉ áp dụng cho chiến dịch quyên góp.</div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/admin/campaigns" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary">Tạo chiến dịch</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const campaignTypeSelect = document.getElementById('campaign_type');
    const goalAmountSection = document.getElementById('goal-amount-section');
    const goalAmountInput = document.getElementById('goal_amount');
    const goalItemSection = document.getElementById('goal-item-section');
    const goalItemInput = document.getElementById('goal_item');
    
    // Set minimum dates for start and end date
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('start_date').setAttribute('min', today);
    document.getElementById('end_date').setAttribute('min', today);
    
    // Update required state of goal amount based on campaign type
    campaignTypeSelect.addEventListener('change', function() {
        if (campaignTypeSelect.value === 'fundraising') {
            goalAmountSection.style.display = 'block';
            goalAmountInput.setAttribute('required', '');
            goalItemSection.style.display = 'none';
            goalItemInput.removeAttribute('required');
        } else if (campaignTypeSelect.value === 'donation') {
            goalAmountSection.style.display = 'none';
            goalAmountInput.removeAttribute('required');
            goalItemSection.style.display = 'block';
            goalItemInput.setAttribute('required', '');
        } else {
            goalAmountSection.style.display = 'none';
            goalAmountInput.removeAttribute('required');
            goalItemSection.style.display = 'none';
            goalItemInput.removeAttribute('required');
        }
    });
    
    // Initialize form based on default selected type
    campaignTypeSelect.dispatchEvent(new Event('change'));
    
    // Validate that end date is after start date
    const startDateInput = document.getElementById('start_date');
    const endDateInput = document.getElementById('end_date');
    
    function updateEndDateMin() {
        const startValue = startDateInput.value;
        if (startValue) {
            endDateInput.setAttribute('min', startValue);
            if (endDateInput.value && endDateInput.value < startValue) {
                endDateInput.value = startValue;
            }
        }
    }
    
    startDateInput.addEventListener('change', updateEndDateMin);
});
</script>
{% endblock %}
